name: CI pipeline

on: 
  push:
    branches:
      - main

jobs:
  project-testing:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: run pipeline
        env:
          DAGSHUB_PAT: ${{secrets.DAGSHUB_PAT}}
        run: |
          dvc repro
      
      - name: Run model tests
        env: 
          DAGSHUB_PAT: ${{secrets.DAGSHUB_PAT}}
        run:
          python -m unittest tests/test_model.py 

      - name: Promote model to production by changing alias to champion
        if: success()
        env:
          DAGSHUB_PAT: ${{secrets.DAGSHUB_PAT}}
        run: python scripts/promote_model.py

      - name: Run Flask app test
        if: success()
        env:
          DAGSHUB_PAT: ${{secrets.DAGSHUB_PAT}}
        run: python -m unittest tests/test_flask_app.py

      - name: Log in to AWS ECR
        if: success()
        run: |
          aws configure set aws_access_key_id ${{secrets.AWS_ACCESS_KEY_ID}}
          aws configure set aws_secret_access_key ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws ecr get-login-password --region ap-south-2 | docker login --username AWS --password-stdin 157328692976.dkr.ecr.ap-south-2.amazonaws.com

      - name: Build Docker image
        if: success()
        run: |
          docker build -t aman-ecr .

      - name: TagDocker image
        if: success()
        run: |
          docker tag aman-ecr:latest 157328692976.dkr.ecr.ap-south-2.amazonaws.com/aman-ecr:latest

      - name: Push Docker image
        if: success()
        run: |
          docker push 157328692976.dkr.ecr.ap-south-2.amazonaws.com/aman-ecr:latest